<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEBULA//OS</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  html,body{
    width:100%;height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    cursor:none;
    -webkit-font-smoothing:antialiased;
  }

  #gl{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    z-index:0;
  }

  .nogl #gl{display:none}
  .fallback{
    position:fixed;
    inset:0;
    z-index:0;
    display:none;
    background:
      radial-gradient(60% 55% at 25% 30%, #2a2f8f 0%, transparent 60%),
      radial-gradient(55% 50% at 78% 68%, #7a1f5c 0%, transparent 62%),
      radial-gradient(70% 60% at 52% 15%, #0d6f8c 0%, transparent 65%),
      #05060d;
    animation:drift 18s ease-in-out infinite alternate;
  }
  .nogl .fallback{display:block}
  @keyframes drift{
    from{filter:hue-rotate(0deg) saturate(1)}
    to{filter:hue-rotate(70deg) saturate(1.4)}
  }

  .scan{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
    opacity:.5;
    mix-blend-mode:overlay;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);
  }

  .grain{
    position:fixed;
    inset:-40%;
    z-index:4;
    pointer-events:none;
    opacity:.055;
    background-image:url("data:image/svg+xml;utf8,");
    animation:gshift .5s steps(3) infinite;
  }
  @keyframes gshift{
    0%{transform:translate(0,0)}
    33%{transform:translate(-2%,1.5%)}
    66%{transform:translate(1.5%,-1%)}
    100%{transform:translate(0,0)}
  }

  .vignette{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
    background:radial-gradient(circle at 50% 50%,transparent 42%,rgba(0,0,0,.38) 78%,rgba(0,0,0,.78) 100%);
  }

  .flash{
    position:fixed;
    inset:0;
    z-index:6;
    pointer-events:none;
    background:#eaf3ff;
    opacity:0;
  }
  .flash.fire{animation:flashOut .55s cubic-bezier(.2,.9,.3,1) forwards}
  @keyframes flashOut{
    0%{opacity:.42}
    100%{opacity:0}
  }

  .hud{
    position:fixed;
    z-index:8;
    font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    font-size:10px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:#fff;
    opacity:.72;
    mix-blend-mode:difference;
    pointer-events:none;
    white-space:nowrap;
  }
  .hud span{opacity:.55}
  .hud-tl{top:22px;left:26px}
  .hud-tr{top:22px;right:26px}
  .hud-bl{bottom:22px;left:26px}
  .hud-br{bottom:22px;right:26px}
  .hud-tl b{font-weight:700;opacity:1}

  .stage{
    position:fixed;
    inset:0;
    z-index:7;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    text-align:center;
    padding:0 4vw;
  }

  .title{
    font-size:clamp(3.2rem,15vw,13rem);
    line-height:.82;
    font-weight:800;
    letter-spacing:-.045em;
    text-transform:uppercase;
    color:#fff;
    text-shadow:
      0 6px 60px rgba(0,0,0,.55),
      0 0 40px rgba(160,200,255,.35),
      0 0 120px rgba(90,140,255,.28),
      0 0 240px rgba(60,90,220,.22);
    will-change:transform,opacity,filter;
    user-select:none;
  }

  .title.swap{animation:titleIn 1s cubic-bezier(.16,1,.3,1)}

  @keyframes titleIn{
    0%{opacity:.45;filter:blur(12px);transform:scale(1.10);letter-spacing:.06em}
    55%{opacity:1}
    100%{opacity:1;filter:blur(0);transform:scale(1);letter-spacing:-.045em}
  }

  .sub{
    margin-top:26px;
    font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    font-size:clamp(8px,1.1vw,11px);
    letter-spacing:.62em;
    text-transform:uppercase;
    color:rgba(255,255,255,.62);
    text-indent:.62em;
  }
  .sub.swap{animation:subIn .9s cubic-bezier(.16,1,.3,1) .06s both}
  @keyframes subIn{
    from{opacity:0;letter-spacing:1.3em;filter:blur(6px)}
    to{opacity:1;letter-spacing:.62em;filter:blur(0)}
  }

  .switcher{
    position:fixed;
    bottom:56px;
    left:50%;
    transform:translateX(-50%);
    z-index:9;
    display:flex;
    gap:0;
    border:1px solid rgba(255,255,255,.16);
    border-radius:999px;
    padding:4px;
    background:rgba(0,0,0,.22);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }

  .switcher button{
    position:relative;
    appearance:none;
    -webkit-appearance:none;
    border:0;
    background:transparent;
    color:rgba(255,255,255,.5);
    font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    font-size:9px;
    letter-spacing:.24em;
    text-transform:uppercase;
    padding:9px 18px;
    border-radius:999px;
    cursor:none;
    transition:color .35s,background .45s,box-shadow .45s;
  }
  .switcher button:hover{color:#fff}
  .switcher button.active{
    color:#050810;
    background:#f2f7ff;
    box-shadow:0 0 26px rgba(180,215,255,.55);
  }

  .hint{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    z-index:8;
    font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    font-size:8.5px;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:rgba(255,255,255,.3);
    white-space:nowrap;
    pointer-events:none;
    transition:opacity 1s;
  }
  .hint.off{opacity:0}

  @media (max-width:640px){
    .hud{font-size:8.5px;letter-spacing:.18em}
    .hud-tl,.hud-bl{left:16px}
    .hud-tr,.hud-br{right:16px}
    .switcher{bottom:46px}
    .switcher button{padding:8px 11px;font-size:8px;letter-spacing:.14em}
    .hint{display:none}
  }

  @media (pointer:coarse){
    html,body{cursor:auto}
    .switcher button{cursor:pointer}
  }

  @media (prefers-reduced-motion:reduce){
    .grain{animation:none}
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>
<div class="fallback"></div>

<div class="vignette"></div>
<div class="scan"></div>
<div class="grain"></div>
<div class="flash" id="flash"></div>

<div class="hud hud-tl"><b>NEBULA</b><span>//</span>OS</div>
<div class="hud hud-tr"><span id="clock">--:--:--</span> &nbsp;&middot;&nbsp; <span id="fps">--</span> FPS</div>
<div class="hud hud-bl">X <span id="px">0.000</span> &nbsp; Y <span id="py">0.000</span> &nbsp; Z <span id="pz">1.00</span></div>
<div class="hud hud-br"><span id="midx">01</span> / 04 &nbsp;&middot;&nbsp; <span id="autoState">AUTO</span></div>

<div class="stage">
  <h1 class="title" id="title">NEBULA</h1>
  <p class="sub" id="sub">FRACTAL NOISE FIELD</p>
</div>

<div class="switcher" id="switcher"></div>
<div class="hint" id="hint">DRAG &middot; SCROLL &middot; CLICK</div>

<script>
(function(){
  "use strict";

  var canvas = document.getElementById("gl");
  var flash  = document.getElementById("flash");
  var titleEl = document.getElementById("title");
  var subEl   = document.getElementById("sub");
  var fpsEl   = document.getElementById("fps");
  var clockEl = document.getElementById("clock");
  var pxEl = document.getElementById("px");
  var pyEl = document.getElementById("py");
  var pzEl = document.getElementById("pz");
  var midxEl = document.getElementById("midx");
  var autoEl = document.getElementById("autoState");
  var hintEl = document.getElementById("hint");
  var switcher = document.getElementById("switcher");

  var MODES = [
    { key:"NEBULA", sub:"FRACTAL NOISE FIELD" },
    { key:"TUNNEL", sub:"INFINITE CORRIDOR" },
    { key:"WAVES",  sub:"INTERFERENCE FIELD" },
    { key:"CHROME", sub:"LIQUID METAL" }
  ];

  function pad(n){ return (n < 10 ? "0" : "") + n; }

  var gl = canvas.getContext("webgl", {
    alpha:false, antialias:false, depth:false, stencil:false,
    premultipliedAlpha:false, powerPreference:"high-performance"
  }) || canvas.getContext("experimental-webgl");

  if (!gl){
    document.body.classList.add("nogl");
    bootFallback();
    return;
  }

  /* ---------------- 着色器 ---------------- */

  var VERT = [
    "attribute vec2 aPos;",
    "void main(){",
    "  gl_Position = vec4(aPos, 0.0, 1.0);",
    "}"
  ].join("\n");

  var FRAG = [
    "precision highp float;",
    "",
    "uniform vec2  uRes;",
    "uniform float uTime;",
    "uniform vec2  uMouse;",
    "uniform float uMode;",
    "uniform float uPulse;",
    "uniform float uZoom;",
    "uniform float uRot;",
    "",
    "#define PI 3.14159265359",
    "",
    "float hash21(vec2 p){",
    "  p = fract(p * vec2(123.34, 456.21));",
    "  p += dot(p, p + 45.32);",
    "  return fract(p.x * p.y);",
    "}",
    "",
    "float noise(vec2 p){",
    "  vec2 i = floor(p);",
    "  vec2 f = fract(p);",
    "  vec2 u = f * f * (3.0 - 2.0 * f);",
    "  float a = hash21(i);",
    "  float b = hash21(i + vec2(1.0, 0.0));",
    "  float c = hash21(i + vec2(0.0, 1.0));",
    "  float d = hash21(i + vec2(1.0, 1.0));",
    "  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);",
    "}",
    "",
    "float fbm(vec2 p){",
    "  float v = 0.0;",
    "  float a = 0.52;",
    "  mat2 m = mat2(0.80, 0.60, -0.60, 0.80);",
    "  for(int i = 0; i < 5; i++){",
    "    v += a * noise(p);",
    "    p = m * p * 2.03;",
    "    a *= 0.5;",
    "  }",
    "  return v;",
    "}",
    "",
    "vec3 palette(float t){",
    "  t = clamp(t, 0.0, 1.0);",
    "  vec3 c1 = vec3(0.03, 0.09, 0.38);",
    "  vec3 c2 = vec3(0.05, 0.62, 0.96);",
    "  vec3 c3 = vec3(0.42, 0.32, 1.00);",
    "  vec3 c4 = vec3(0.98, 0.24, 0.70);",
    "  vec3 c5 = vec3(1.00, 0.58, 0.42);",
    "  vec3 col;",
    "  if (t < 0.30)      col = mix(c1, c2, t / 0.30);",
    "  else if (t < 0.55) col = mix(c2, c3, (t - 0.30) / 0.25);",
    "  else if (t < 0.78) col = mix(c3, c4, (t - 0.55) / 0.23);",
    "  else               col = mix(c4, c5, (t - 0.78) / 0.22);",
    "  return col;",
    "}",
    "",
    "float stars(vec2 uv, float thr, float sz){",
    "  vec2 id = floor(uv);",
    "  vec2 f = fract(uv) - 0.5;",
    "  float h = hash21(id);",
    "  if (h < thr) return 0.0;",
    "  float off = 0.6;",
    "  vec2 sp = vec2(hash21(id + 3.7), hash21(id + 9.1)) * off - off * 0.5;",
    "  float d = length(f - sp);",
    "  float tw = 0.55 + 0.45 * sin(uTime * 2.4 + h * 47.0);",
    "  return smoothstep(sz, 0.0, d) * tw;",
    "}",
    "",
    "vec3 sceneNebula(vec2 uv, float t){",
    "  uv *= 1.55;",
    "  vec2 p = uv + vec2(uMouse.x * 0.16, uMouse.y * 0.16);",
    "  vec2 q = vec2(fbm(p), fbm(p + vec2(3.2, 5.7)));",
    "  vec2 r = vec2(",
    "    fbm(p + 2.2 * q + vec2(0.10 * t, 0.0)),",
    "    fbm(p + 2.2 * q + vec2(8.3, 2.8) + vec2(0.0, 0.09 * t))",
    "  );",
    "  float f = fbm(p + 2.6 * r);",
    "  float m = smoothstep(0.32, 0.80, f);",
    "  vec3 col = palette(f * 0.95 + 0.03 + 0.04 * t) * m * 3.10;",
    "  col += vec3(1.00, 0.97, 1.00) * pow(smoothstep(0.58, 0.96, f), 2.2) * 0.38;",
    "  col += palette(length(uv) * 0.40 + 0.55) * 0.045 * m;",
    "  float st = stars(uv * 13.0, 0.900, 0.085)",
    "           + stars(uv * 24.0, 0.940, 0.060) * 0.55;",
    "  col += vec3(0.86, 0.93, 1.00) * st * 1.15;",
    "  return col;",
    "}",
    "",
    "vec3 sceneTunnel(vec2 uv, float t){",
    "  float r = length(uv) + 0.0008;",
    "  float a = atan(uv.y, uv.x);",
    "  float u = a / PI;",
    "  float v = 1.05 / r + t * 0.55;",
    "  float f = fbm(vec2(u * 2.2, v * 0.90));",
    "  float g = fbm(vec2(u * 5.0, v * 1.40 + 3.0));",
    "  float band = 0.5 + 0.5 * sin(v * 2.6 + f * 6.5);",
    "  vec3 col = palette(f * 0.75 + 0.06 + 0.04 * t) * pow(clamp(f, 0.0, 1.0), 1.5) * 3.40;",
    "  col += palette(g * 0.55 + 0.12) * band * 0.45 * smoothstep(1.0, 0.05, r);",
    "  col *= smoothstep(0.0, 0.18, r);",
    "  col += vec3(0.75, 0.90, 1.00) * exp(-r * 5.0) * 1.20;",
    "  return col;",
    "}",
    "",
    "vec3 sceneWaves(vec2 uv, float t){",
    "  float v = 0.0;",
    "  for(int i = 0; i < 4; i++){",
    "    float fi = float(i);",
    "    vec2 c = vec2(",
    "      sin(t * 0.50 + fi * 2.13) * 0.55,",
    "      cos(t * 0.42 + fi * 1.71) * 0.48",
    "    );",
    "    float d = length(uv - c);",
    "    v += sin(d * 26.0 - t * 2.1 + fi * 1.6) * exp(-d * 1.5);",
    "  }",
    "  float w = clamp(0.5 + 0.375 * v, 0.0, 1.0);",
    "  float m = pow(w, 2.6);",
    "  vec3 col = palette(w * 0.70 + 0.05 + 0.03 * t) * m * 3.40;",
    "  col += vec3(0.60, 0.86, 1.00) * pow(w, 12.0) * 0.90;",
    "  return col;",
    "}",
    "",
    "vec3 sceneChrome(vec2 uv, float t){",
    "  uv *= 0.95;",
    "  float e = 0.0030;",
    "  vec2 q = uv + vec2(0.0, t * 0.06);",
    "  float f0 = fbm(q);",
    "  float fx = fbm(q + vec2(e, 0.0));",
    "  float fy = fbm(q + vec2(0.0, e));",
    "  vec3 n = normalize(vec3((f0 - fx) / e * 0.26, (f0 - fy) / e * 0.26, 1.0));",
    "",
    "  vec3 V = vec3(0.0, 0.0, 1.0);",
    "  vec3 R = reflect(-V, n);",
    "",
    "  vec3 env = mix(vec3(0.01, 0.03, 0.16), vec3(0.42, 0.72, 1.00), smoothstep(-0.60, 0.65, R.y));",
    "  env = mix(env, vec3(1.00, 0.36, 0.70), smoothstep(0.15, 1.00, R.x) * 0.55);",
    "  env = mix(env, vec3(0.10, 0.94, 0.92), smoothstep(0.15, 1.00, -R.x) * 0.40);",
    "  float strip1 = smoothstep(0.62, 1.00, sin(R.x * 4.5 + R.y * 2.0 + t * 0.25));",
    "  float strip2 = smoothstep(0.84, 1.00, sin(R.x * 9.0 - R.y * 5.0 + 1.7));",
    "  env += vec3(0.95, 0.98, 1.00) * strip1 * 0.75;",
    "  env += vec3(1.00, 0.55, 0.82) * strip2 * 0.40;",
    "",
    "  vec3 L1 = normalize(vec3(-0.45, 0.55, 0.70));",
    "  vec3 L2 = normalize(vec3(0.65, -0.30, 0.70));",
    "  float s1 = pow(max(dot(n, normalize(L1 + V)), 0.0), 130.0);",
    "  float s2 = pow(max(dot(n, normalize(L2 + V)), 0.0), 46.0);",
    "  float fres = pow(1.0 - max(dot(n, V), 0.0), 3.0);",
    "",
    "  vec3 tint = palette(f0 * 1.30 + 0.30 + 0.03 * t);",
    "  vec3 col = env * 0.78 + tint * 0.18;",
    "  col += vec3(1.00, 0.98, 1.00) * s1 * 2.40;",
    "  col += vec3(0.70, 0.90, 1.00) * s2 * 0.50;",
    "  col += tint * fres * 0.75;",
    "  return col;",
    "}",
    "",
    "void main(){",
    "  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / min(uRes.x, uRes.y);",
    "  uv /= uZoom;",
    "  float cr = cos(uRot);",
    "  float sr = sin(uRot);",
    "  uv = mat2(cr, -sr, sr, cr) * uv;",
    "",
    "  vec3 col;",
    "  if (uMode < 0.5)      col = sceneNebula(uv, uTime * 0.34);",
    "  else if (uMode < 1.5) col = sceneTunnel(uv, uTime * 0.85);",
    "  else if (uMode < 2.5) col = sceneWaves(uv, uTime);",
    "  else                  col = sceneChrome(uv, uTime);",
    "",
    "  float dm = length(uv - uMouse * 0.85 / uZoom);",
    "  col += vec3(0.22, 0.42, 1.0) * exp(-dm * 3.4) * 0.30;",
    "",
    "  col += vec3(0.90, 0.95, 1.0) * uPulse * 0.55 * exp(-length(uv) * 2.2);",
    "",
    "  float vig = length(uv) * 0.64;",
    "  col *= 1.0 - 0.66 * vig * vig;",
    "",
    "  col = max(col - 0.050, vec3(0.0));",
    "  col = 1.0 - exp(-col * 1.30);",
    "  col = max(col - 0.030, vec3(0.0));",
    "  col = pow(col, vec3(0.85));",
    "  float lum = dot(col, vec3(0.299, 0.587, 0.114));",
    "  col = mix(vec3(lum), col, 1.35);",
    "  col = clamp(col, 0.0, 1.0);",
    "",
    "  col += (hash21(gl_FragCoord.xy + fract(uTime) * 137.0) - 0.5) * 0.016;",
    "",
    "  gl_FragColor = vec4(col, 1.0);",
    "}"
  ].join("\n");

  function compile(type, src){
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
      console.error("shader error: " + gl.getShaderInfoLog(s));
      gl.deleteShader(s);
      return null;
    }
    return s;
  }

  var vs = compile(gl.VERTEX_SHADER, VERT);
  var fs = compile(gl.FRAGMENT_SHADER, FRAG);

  if (!vs || !fs){
    document.body.classList.add("nogl");
    bootFallback();
    return;
  }

  var prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);

  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)){
    console.error("link error: " + gl.getProgramInfoLog(prog));
    document.body.classList.add("nogl");
    bootFallback();
    return;
  }

  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

  var aPos = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  var U = {
    res:   gl.getUniformLocation(prog, "uRes"),
    time:  gl.getUniformLocation(prog, "uTime"),
    mouse: gl.getUniformLocation(prog, "uMouse"),
    mode:  gl.getUniformLocation(prog, "uMode"),
    pulse: gl.getUniformLocation(prog, "uPulse"),
    zoom:  gl.getUniformLocation(prog, "uZoom"),
    rot:   gl.getUniformLocation(prog, "uRot")
  };

  /* ---------------- 状态 ---------------- */

  var W = 1, H = 1;
  var time = 0;
  var mode = 0;
  var modeTimer = 0;
  var autoPlay = true;
  var MODE_DURATION = 9.0;

  var mouseT = { x:0, y:0 };
  var mouseC = { x:0, y:0 };

  var zoomT = 1.0, zoomC = 1.0;
  var rotT = 0, rotC = 0;
  var drag = false, lastX = 0, lastY = 0, dragVel = 0;
  var pulse = 0;

  function setMode(i, manual){
    mode = ((i % MODES.length) + MODES.length) % MODES.length;
    modeTimer = 0;

    if (manual){
      autoPlay = false;
      autoEl.textContent = "MANUAL";
    }

    var m = MODES[mode];
    titleEl.textContent = m.key;
    subEl.textContent = m.sub;

    titleEl.classList.remove("swap");
    subEl.classList.remove("swap");
    void titleEl.offsetWidth;
    titleEl.classList.add("swap");
    subEl.classList.add("swap");

    midxEl.textContent = ("0" + (mode + 1)).slice(-2);

    for (var k = 0; k < switcher.children.length; k++){
      switcher.children[k].classList.toggle("active", k === mode);
    }

    flash.classList.remove("fire");
    void flash.offsetWidth;
    flash.classList.add("fire");
  }

  for (var mi = 0; mi < MODES.length; mi++){
    (function(i){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = MODES[i].key;
      b.addEventListener("click", function(e){
        e.stopPropagation();
        setMode(i, true);
      });
      switcher.appendChild(b);
    })(mi);
  }

  /* ---------------- 交互 ---------------- */

  function onMove(x, y){
    mouseT.x = (x / window.innerWidth) * 2 - 1;
    mouseT.y = -((y / window.innerHeight) * 2 - 1);
  }

  window.addEventListener("mousemove", function(e){
    onMove(e.clientX, e.clientY);
    if (drag){
      var dx = e.clientX - lastX;
      var dy = e.clientY - lastY;
      rotT += dx * 0.0045;
      dragVel = dx * 0.0045;
      zoomT = Math.max(0.55, Math.min(2.6, zoomT + dy * 0.0016));
      lastX = e.clientX;
      lastY = e.clientY;
    }
  }, { passive:true });

  window.addEventListener("mousedown", function(e){
    if (e.target && e.target.tagName === "BUTTON") return;
    drag = true;
    lastX = e.clientX;
    lastY = e.clientY;
    pulse = 1.0;
  });

  window.addEventListener("mouseup", function(){ drag = false; });

  window.addEventListener("touchstart", function(e){
    if (e.target && e.target.tagName === "BUTTON") return;
    var t = e.touches[0];
    onMove(t.clientX, t.clientY);
    drag = true;
    lastX = t.clientX;
    lastY = t.clientY;
    pulse = 1.0;
  }, { passive:true });

  window.addEventListener("touchmove", function(e){
    var t = e.touches[0];
    onMove(t.clientX, t.clientY);
    if (drag){
      var dx = t.clientX - lastX;
      rotT += dx * 0.005;
      dragVel = dx * 0.005;
      lastX = t.clientX;
    }
  }, { passive:true });

  window.addEventListener("touchend", function(){ drag = false; }, { passive:true });

  window.addEventListener("wheel", function(e){
    e.preventDefault();
    zoomT = Math.max(0.55, Math.min(2.6, zoomT + e.deltaY * 0.0011));
    hideHint();
  }, { passive:false });

  var hintHidden = false;
  function hideHint(){
    if (hintHidden) return;
    hintHidden = true;
    hintEl.classList.add("off");
  }
  setTimeout(hideHint, 9000);

  /* ---------------- 尺寸 ---------------- */

  var resizeTimer = null;

  function resize(){
    var scale = Math.min(window.devicePixelRatio || 1, 1.25) * 0.8;
    W = Math.max(1, Math.round(window.innerWidth * scale));
    H = Math.max(1, Math.round(window.innerHeight * scale));
    canvas.width = W;
    canvas.height = H;
    gl.viewport(0, 0, W, H);
  }

  window.addEventListener("resize", function(){
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 150);
  });

  /* ---------------- 时钟 ---------------- */

  function updateClock(){
    var d = new Date();
    clockEl.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }
  updateClock();
  setInterval(updateClock, 1000);

  /* ---------------- 主循环 ---------------- */

  var last = performance.now();
  var fpsAcc = 0, fpsFrames = 0, hudTick = 0;

  function frame(now){
    var dt = (now - last) / 1000;
    last = now;
    if (!isFinite(dt) || dt <= 0) dt = 0.016;
    if (dt > 0.08) dt = 0.08;

    time += dt;

    if (autoPlay){
      modeTimer += dt;
      if (modeTimer > MODE_DURATION) setMode(mode + 1, false);
    }

    mouseC.x += (mouseT.x - mouseC.x) * 0.06;
    mouseC.y += (mouseT.y - mouseC.y) * 0.06;
    zoomC += (zoomT - zoomC) * 0.07;

    if (!drag){
      rotT += dragVel;
      dragVel *= 0.94;
      rotT += 0.035 * dt;
    }
    rotC += (rotT - rotC) * 0.09;

    pulse *= Math.pow(0.06, dt);

    gl.uniform2f(U.res, W, H);
    gl.uniform1f(U.time, time);
    gl.uniform2f(U.mouse, mouseC.x, mouseC.y);
    gl.uniform1f(U.mode, mode);
    gl.uniform1f(U.pulse, pulse);
    gl.uniform1f(U.zoom, zoomC);
    gl.uniform1f(U.rot, rotC);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    fpsAcc += dt * 1000;
    fpsFrames++;
    if (fpsAcc >= 400){
      fpsEl.textContent = Math.round(1000 / (fpsAcc / fpsFrames));
      fpsAcc = 0;
      fpsFrames = 0;
    }

    hudTick += dt;
    if (hudTick > 0.1){
      hudTick = 0;
      pxEl.textContent = mouseC.x.toFixed(3);
      pyEl.textContent = mouseC.y.toFixed(3);
      pzEl.textContent = zoomC.toFixed(2);
    }

    requestAnimationFrame(frame);
  }

  resize();

  var startMode = 0;
  try {
    var qs = new URLSearchParams(window.location.search);
    var qm = parseInt(qs.get("m"), 10);
    if (!isNaN(qm) && qm >= 0 && qm < MODES.length) startMode = qm;
  } catch (err) { startMode = 0; }

  setMode(startMode, false);
  autoEl.textContent = "AUTO";
  requestAnimationFrame(frame);

  /* 键盘：1-4 切换，空格暂停自动 */
  window.addEventListener("keydown", function(e){
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= MODES.length){
      setMode(n - 1, true);
      return;
    }
    if (e.code === "Space" || e.key === " "){
      e.preventDefault();
      autoPlay = !autoPlay;
      autoEl.textContent = autoPlay ? "AUTO" : "MANUAL";
      if (autoPlay) modeTimer = 0;
      setMode(mode, false);
    }
  });

  /* ---------------- 兜底 ---------------- */

  function bootFallback(){
    titleEl.textContent = MODES[0].key;
    subEl.textContent = MODES[0].sub;
    fpsEl.textContent = "--";
    midxEl.textContent = "01";
    autoEl.textContent = "STATIC";

    for (var i = 0; i < MODES.length; i++){
      (function(idx){
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = MODES[idx].key;
        if (idx === 0) b.classList.add("active");
        b.addEventListener("click", function(){
          for (var k = 0; k < switcher.children.length; k++){
            switcher.children[k].classList.toggle("active", k === idx);
          }
          titleEl.textContent = MODES[idx].key;
          subEl.textContent = MODES[idx].sub;
          titleEl.classList.remove("swap");
          void titleEl.offsetWidth;
          titleEl.classList.add("swap");
          midxEl.textContent = ("0" + (idx + 1)).slice(-2);
        });
        switcher.appendChild(b);
      })(i);
    }

    function tickClock(){
      var d = new Date();
      clockEl.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    }
    tickClock();
    setInterval(tickClock, 1000);
  }

})();
</script>
</body>
</html>
